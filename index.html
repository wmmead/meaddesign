<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MeadDesign</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">

    <!-- My Styles -->
    <link href="styles.css" rel="stylesheet">

    <!-- JavaScript -->
    <script src="granim/dist/granim.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.15.0/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.15.0/SplitText.min.js"></script>
    <script src="script.js" defer></script>
    <script src="audio.js" defer></script>
</head>
<body>
    <h1>MeadDesign</h1>
    <button id="audio-btn" class="audio-start-btn">Start the audio experience.<br>Sound, speakers, headphones ON</button>
    <canvas id="granim-canvas-1" class="granim-layer"></canvas>
    <canvas id="granim-canvas-2" class="granim-layer granim-layer--screen"></canvas>
    <canvas id="granim-canvas-3" class="granim-layer granim-layer--overlay"></canvas>

    <p id="playing"></p>
</body>
</html>
